services:
  rj:
    image: rjchicago/rj:dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    image: rjchicago/rj-api:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3001
      - NODE_ENV=development
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
