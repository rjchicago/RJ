services:
  rj:
    image: rjchicago/rj:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:3001
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: rjchicago/rj-api:dev
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./.env
    environment:
      - PORT=3001
      - NODE_ENV=development
    ports:
      - "3001:3001"
    restart: unless-stopped
