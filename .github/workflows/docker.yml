name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'plans/**'

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '524541702023'
  ECR_WEB_REPOSITORY: rj/web
  ECR_API_REPOSITORY: rj/api

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Run API lint
        run: npm run lint
        working-directory: apps/api

      - name: Run API tests
        run: npm test
        working-directory: apps/api

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run web lint
        run: npm run lint
        working-directory: apps/web

      - name: Run web tests
        run: npm test
        working-directory: apps/web

      - name: Build web bundle
        run: npm run build
        working-directory: apps/web

  image-validation:
    name: Validate production images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: ./apps/web
            file: ./apps/web/Dockerfile
          - image: api
            context: ./apps/api
            file: ./apps/api/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: rj-local:${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: image-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty CI environment file
        run: touch .env

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for health endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/health >/dev/null \
              && curl --fail --silent http://localhost:5173/ >/dev/null \
              && curl --fail --silent http://localhost:5173/api/config >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Compose smoke test timed out' >&2
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down

  publish:
    name: Publish immutable images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: rj-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    needs: [source-validation, image-validation, smoke-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524541702023:role/rj-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash aws/deploy-rj.sh --no-profile --tag "$RELEASE_SHA"
